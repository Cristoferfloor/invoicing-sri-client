services:
  sri-client:
    build: .
    image: sri-client-service:0.1.2
    container_name: sri-client-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SRI_CLIENT_PORT:-3004}:3004"
    env_file:
      - .env
    networks: [pac-invoicing-v2]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3004/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# La red la crea Infrastructure/docker-compose.yml: levantar eso primero.
networks:
  pac-invoicing-v2:
    external: true
